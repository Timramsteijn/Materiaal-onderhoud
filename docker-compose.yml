services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: materiaal
      POSTGRES_PASSWORD: materiaal
      POSTGRES_DB: materiaalonderhoud
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U materiaal -d materiaalonderhoud"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://materiaal:materiaal@db:5432/materiaalonderhoud?schema=public
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      SEED_ADMIN_WACHTWOORD: ${SEED_ADMIN_WACHTWOORD:-verander-mij-direct}
    ports:
      - "3000:3000"

volumes:
  db-data:
